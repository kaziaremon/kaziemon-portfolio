<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Deep Royal Purple Rounded Shield Background -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d0b4d"/>
      <stop offset="50%" stop-color="#19042b"/>
      <stop offset="100%" stop-color="#0a0210"/>
    </linearGradient>
    <!-- Razor-Sharp Neon-Violet Glowing Border -->
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <!-- Monogram Gradients -->
    <linearGradient id="paint0_linear" x1="7" y1="6" x2="19" y2="26" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="paint1_linear" x1="21" y1="6" x2="27" y2="26" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c084fc"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glowing Royal Purple Rounded Shield Card -->
  <rect x="4" y="4" width="56" height="56" rx="18" fill="url(#shieldGrad)" stroke="url(#neonBorder)" stroke-width="2" filter="url(#glow)"/>

  <!-- Scaled Centered Monogram (viewBox 32x32 scaled to 36x36 at (14, 14)) -->
  <g transform="translate(14, 14) scale(1.125)">
    <!-- K stroke -->
    <path d="M7 6V26M7 16L18 6M7 17L19 26" stroke="url(#paint0_linear)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- E bars -->
    <path d="M21 6H27V13H21V6ZM21 19H27V26H21V19Z" fill="url(#paint1_linear)"/>
  </g>
</svg>
