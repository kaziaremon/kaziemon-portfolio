<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Deep Royal Purple Rounded Background -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a084e"/>
      <stop offset="50%" stop-color="#16042b"/>
      <stop offset="100%" stop-color="#0b0214"/>
    </linearGradient>

    <!-- Sleek Neon Royal Purple Glowing Border -->
    <linearGradient id="purpleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Monogram Gradients -->
    <linearGradient id="monogramK" x1="7" y1="6" x2="19" y2="26" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="monogramE" x1="21" y1="6" x2="27" y2="26" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c084fc"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Royal Purple Glowing Dot Gradient -->
    <radialGradient id="purpleDot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="40%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dotGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glowing Royal Purple Card Background -->
  <rect x="4" y="4" width="56" height="56" rx="18" fill="url(#shieldGrad)" stroke="url(#purpleBorder)" stroke-width="2.2" filter="url(#glow)"/>

  <!-- Centered Kazi Emon Monogram -->
  <g transform="translate(13, 14) scale(1.1)">
    <!-- K stroke -->
    <path d="M7 6V26M7 16L18 6M7 17L19 26" stroke="url(#monogramK)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- E bars -->
    <path d="M21 6H27V12H21V6ZM21 16H27V22H21V16Z" fill="url(#monogramE)"/>
    <!-- Signature Royal Purple Accent Dot -->
    <circle cx="24" cy="27" r="2.8" fill="url(#purpleDot)" filter="url(#dotGlow)"/>
  </g>
</svg>
