<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Vibrant Royal Purple & Midnight Violet Gradients (Inspired by #4A0E4E) -->
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a0e4e" />
      <stop offset="45%" stop-color="#2a0845" />
      <stop offset="100%" stop-color="#0b0214" />
    </linearGradient>

    <!-- Razor-Sharp Neon-Violet & Radiant Magenta Accent Gradient -->
    <linearGradient id="neonVioletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff" />
      <stop offset="25%" stop-color="#e879f9" />
      <stop offset="60%" stop-color="#c026d3" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    <linearGradient id="goldWhiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f5d0fe" />
      <stop offset="100%" stop-color="#e879f9" />
    </linearGradient>

    <!-- Ultra-Sleek Outer Glow Filter -->
    <filter id="neonGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="4.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Razor-Sharp Outer Neon-Violet Glowing Ring -->
  <rect x="8" y="8" width="112" height="112" rx="30" fill="none" stroke="url(#neonVioletGrad)" stroke-width="2.5" opacity="0.9" filter="url(#neonGlow)" />

  <!-- Sophisticated Deep Royal-Purple Gradient Badge (#4A0E4E inspired) -->
  <rect x="10" y="10" width="108" height="108" rx="28" fill="url(#badgeBg)" stroke="rgba(232, 121, 249, 0.3)" stroke-width="1.2" filter="url(#subtleShadow)" />

  <!-- Inner Precision Accent Frame -->
  <rect x="16" y="16" width="96" height="96" rx="22" fill="none" stroke="#c026d3" stroke-width="0.75" stroke-dasharray="3 3" opacity="0.45" />

  <!-- Custom-Engineered Interlocking Fused "KE" Monogram -->
  <g transform="translate(31, 27)" id="monogramGroup">
    <!-- Main Upright Spine (Shared Anchor for K and E) -->
    <rect x="0" y="5" width="9.5" height="64" rx="4.75" fill="url(#neonVioletGrad)" />

    <!-- K Upper Diagonal Arm (Sleek Angular Blade) -->
    <path d="M 7 37 L 31 9 C 32.5 7.5 35.5 8.5 34.5 11.5 L 18 35 Z" fill="url(#neonVioletGrad)" />

    <!-- K Lower Diagonal Arm (Anchoring Leg) -->
    <path d="M 12 33 L 36 67 C 37.5 69 34 71.5 32 69 L 8 40 Z" fill="url(#neonVioletGrad)" />

    <!-- E Top Horizontal Bar (Crisp White, Interlocking through K upper aperture) -->
    <rect x="36" y="9" width="30" height="8.5" rx="4.25" fill="url(#goldWhiteGrad)" />

    <!-- E Middle Horizontal Bar (Radiant Magenta-Violet) -->
    <rect x="29" y="33" width="26" height="8" rx="4" fill="url(#neonVioletGrad)" />

    <!-- E Bottom Horizontal Bar (Crisp White Base) -->
    <rect x="36" y="57" width="30" height="8.5" rx="4.25" fill="url(#goldWhiteGrad)" />
  </g>

  <!-- Luminous Ambient Spark Dot -->
  <circle cx="96" cy="31" r="3.2" fill="#fdf4ff" filter="url(#neonGlow)" />
  <circle cx="96" cy="31" r="1.5" fill="#ffffff" />
</svg>
