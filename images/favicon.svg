<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d124f" />
      <stop offset="100%" stop-color="#120624" />
    </linearGradient>
    <filter id="violetGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect x="10" y="10" width="100" height="100" rx="26" fill="url(#bgGrad)" stroke="url(#purpleGrad)" stroke-width="3" />

  <!-- Glowing Inner Accent -->
  <rect x="14" y="14" width="92" height="92" rx="22" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.35" />

  <!-- Monogram KE Typography -->
  <text x="60" y="74" font-family="'Outfit', -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    KE
  </text>

  <!-- Decorative Corner Dot -->
  <circle cx="92" cy="28" r="4" fill="#c084fc" filter="url(#violetGlow)" />
</svg>
